[run]
# Run `node` and node-shebang bins on Bun (the root bunfig.toml is not read from here)
bun = true

[test]
# Unit tests live next to the code; Playwright's specs in e2e/ aren't for bun test
root = "src"
preload = [ "./test/preload.ts" ]
coverageSkipTestFiles = true
coveragePathIgnorePatterns = [
  "src/gql/**",
  "src/**/__tests__/**",
  "test/**"
]
# Bun measures lines and functions (not branches)
coverageThreshold = { lines = 1.0, functions = 1.0 }
coverageReporter = [
  "text",
  "lcov"
]
