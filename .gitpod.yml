image:
  file: .gitpod.Dockerfile

tasks:
  - init: bun install && bun run build
    name: dev
    command: |
      gp sync-done ready
      bun run dev
  - name: bun run start:chromium
    command: |
      gp sync-await ready
      gp ports await 6080
      gp preview $(gp url 6080)
      sleep 5
      bun run start:chromium
    openMode: split-right

ports:
  - port: 5900
    onOpen: ignore
  - port: 6080
    onOpen: ignore
