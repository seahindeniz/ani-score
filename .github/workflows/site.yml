name: Site

# Builds the site with the prebuilt anime index, and deploys it to GitHub Pages: from a release that changed either,
# and daily, so the index follows the anime database it's built from
on:
  workflow_call:
  workflow_dispatch:
  schedule:
    - cron: '17 5 * * *'

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Install Bun
        uses: oven-sh/setup-bun@v2
        with:
          # `bun lint` and `bun fmt` are only in canary builds; switch back to `bun-version-file: package.json` once Bun 1.4.4 is released
          bun-version: canary

      - name: Cache Bun dependencies
        uses: actions/cache@v6
        with:
          path: ~/.bun/install/cache
          key: bun-${{ runner.os }}-${{ hashFiles('bun.lock') }}
          restore-keys: bun-${{ runner.os }}-

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Build site
        run: bun run build:site

      # A Pages deploy replaces the whole site, so every deploy carries the index
      - name: Build anime index
        working-directory: packages/extension
        run: bun run anime-index ../site/.output/public

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v5
        with:
          path: packages/site/.output/public

  deploy:
    needs: build
    runs-on: ubuntu-latest
    # Only the deploy can publish, so the build's third-party steps never hold these
    permissions:
      pages: write
      id-token: write
    concurrency:
      group: deploy-site
      cancel-in-progress: true
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
