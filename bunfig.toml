[install]
# Hoist everything to the root node_modules (replaces pnpm's shamefully-hoist)
linker = "hoisted"
# Save exact versions (replaces pnpm's save-prefix="")
exact = true

[run]
# Run `node` and node-shebang bins (vite, tsc, ...) on Bun
bun = true

[fmt]
singleQuote = true
sortImports = true
# Wrapped lines start with the operator (`&&`, `||`, `+`, ...)
experimentalOperatorPosition = "start"
# Generated by GraphQL codegen and unplugin-auto-import (rewritten on every build), and by scripts/site-schema.ts
# (a unit test compares it to a fresh copy)
ignorePatterns = [
  "**/src/gql/**",
  "**/src/auto-imports.d.ts",
  "**/src/sites/site.schema.json",
]

# The generated types in src/gql match these queries by their exact text, so they aren't reformatted
[[fmt.overrides]]
files = ["**/gql-queries/**"]
options = { embeddedLanguageFormatting = "off" }

[lint]
# Bun's recommended rules, plus Solid's: they aren't built in, so its ESLint plugin runs in JavaScript
plugins = ["eslint-plugin-solid"]
ignorePatterns = ["**/src/gql/**", "**/src/auto-imports.d.ts"]

[lint.rules]
"typescript/no-explicit-any" = "off"
"no-console" = ["error", { allow = ["warn", "error"] }]

# Build scripts log their progress
[[lint.overrides]]
files = ["**/scripts/**"]
rules = { "no-console" = "off" }

[[lint.overrides]]
files = ["**/*.tsx"]

[lint.overrides.rules]
# Solid assigns `let ref!: T` through `ref={ref}`, which this rule can't see
"no-unassigned-vars" = "off"
# eslint-plugin-solid's recommended rules for TypeScript
"solid/components-return-once" = "warn"
"solid/event-handlers" = "warn"
"solid/imports" = "warn"
"solid/jsx-no-duplicate-props" = "error"
"solid/jsx-no-script-url" = "error"
"solid/jsx-no-undef" = ["error", { typescriptEnabled = true }]
"solid/jsx-uses-vars" = "error"
"solid/no-destructure" = "error"
"solid/no-innerhtml" = "error"
"solid/no-react-deps" = "warn"
"solid/no-react-specific-props" = "warn"
"solid/prefer-for" = "error"
"solid/reactivity" = "warn"
"solid/self-closing-comp" = "warn"
"solid/style-prop" = "warn"
